<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petruska Engine Pro - Acceso Seguro</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff; display: flex; justify-content: center; align-items: center;
            background: #020617; overflow: hidden;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 25px; border-radius: 24px;
            width: 90%; max-width: 340px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(16px);
        }
        h2 { color: #38bdf8; margin-top: 0; font-size: 22px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: white; box-sizing: border-box;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn-login {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; border: none; padding: 12px; border-radius: 12px;
            width: 100%; font-weight: bold; cursor: pointer; font-size: 14px;
            margin-top: 10px; box-shadow: 0 4px 15px rgba(0,114,255,0.4);
        }
        .error { color: #f87171; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Petruska Vault</h2>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Acceso restringido y cifrado</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Usuario" required autocomplete="off">
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Entrar a la Bóveda</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
