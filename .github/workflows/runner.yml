name: Symbio Cloud Runner

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del archivo multimedia a procesar'
        required: true
        default: 'https://www.w3schools.com/html/mov_bbb.mp4'

jobs:
  process-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ejecutar transcodificación en la nube
        run: |
          echo "Iniciando máquina virtual de alta potencia..."
          echo "Descargando archivo multimedia desde la URL..."
          curl -sL "${{ github.event.inputs.url }}" -o input.mp4
          
          echo "Comprobando tamaño del archivo descargado..."
          ls -l input.mp4

          echo "Procesando vídeo usando los núcleos de la nube..."
          ffmpeg -i input.mp4 -vcodec libx264 -crf 28 output.mp4

      - name: Subir artefacto resultante
        uses: actions/upload-artifact@v4
        with:
          name: symbio-petruzka-binario
          path: output.mp4
